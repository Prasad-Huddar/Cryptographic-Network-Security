<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" fill="none">
  <defs>
    <linearGradient id="bagGrad" x1="210" y1="95" x2="365" y2="335" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A90F5"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="bagSideGrad" x1="190" y1="115" x2="225" y2="335" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="485" y1="30" x2="555" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#28B885"/>
    </linearGradient>
    <linearGradient id="navyCardGrad" x1="420" y1="300" x2="590" y2="395" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#163252"/>
      <stop offset="100%" stop-color="#0F253E"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#102A43" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Soft background halo circles -->
  <circle cx="330" cy="220" r="175" fill="#F2F6FC"/>
  <circle cx="520" cy="75" r="52" fill="#EBF8F3"/>
  <circle cx="115" cy="315" r="42" fill="#F0F5FB"/>

  <!-- Subtle decorative dot grid (bottom left like reference) -->
  <g fill="#CBD5E1">
    <circle cx="65" cy="340" r="2"/><circle cx="80" cy="340" r="2"/><circle cx="95" cy="340" r="2"/><circle cx="110" cy="340" r="2"/>
    <circle cx="65" cy="355" r="2"/><circle cx="80" cy="355" r="2"/><circle cx="95" cy="355" r="2"/><circle cx="110" cy="355" r="2"/>
    <circle cx="65" cy="370" r="2"/><circle cx="80" cy="370" r="2"/><circle cx="95" cy="370" r="2"/><circle cx="110" cy="370" r="2"/>
  </g>

  <!-- Ground shadow ellipse -->
  <ellipse cx="325" cy="362" rx="195" ry="14" fill="#E2E8F0" opacity="0.7"/>

  <!-- Botanical Plant Leaves (Left of Bag, matching reference) -->
  <g transform="translate(135, 185)">
    <!-- Stems -->
    <path d="M55 125 C48 90, 28 60, 8 35" stroke="#1E8E68" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M55 125 C55 85, 58 45, 52 10" stroke="#1E8E68" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M55 125 C65 95, 82 68, 96 42" stroke="#1E8E68" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Leaves -->
    <path d="M8 35 C2 18, 22 14, 30 32 C35 44, 16 48, 8 35 Z" fill="#28B885"/>
    <path d="M26 65 C10 52, 2 66, 16 80 C28 90, 38 76, 26 65 Z" fill="#34D399"/>
    <path d="M52 10 C40 -4, 64 -4, 62 14 C60 28, 46 24, 52 10 Z" fill="#28B885"/>
    <path d="M55 50 C42 34, 68 30, 68 48 C68 62, 52 60, 55 50 Z" fill="#34D399"/>
    <path d="M96 42 C106 28, 84 22, 78 38 C72 52, 90 54, 96 42 Z" fill="#28B885"/>
    <!-- Planter Pot -->
    <rect x="33" y="120" width="46" height="40" rx="4" fill="#E2E8F0"/>
    <rect x="29" y="116" width="54" height="8" rx="3" fill="#CBD5E1"/>
  </g>

  <!-- Main Shopping Bag Handles (Dark Navy, matching reference) -->
  <path d="M250 112 C250 56, 315 56, 315 112" stroke="#132B47" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M268 112 C268 64, 332 64, 332 112" stroke="#1E3A5F" stroke-width="5.5" stroke-linecap="round" fill="none"/>

  <!-- Main Blue Shopping Bag -->
  <g filter="url(#softShadow)">
    <!-- Left Gusset -->
    <polygon points="195,116 220,108 212,345 186,338" fill="url(#bagSideGrad)"/>
    <!-- Front Face -->
    <polygon points="220,108 366,108 378,345 212,345" fill="url(#bagGrad)"/>
    <!-- Top Fold Highlight -->
    <polygon points="220,108 366,108 367,118 219,118" fill="#60A5FA" opacity="0.45"/>
    <!-- Subtle Security Watermark Badge on Bag -->
    <circle cx="294" cy="222" r="28" fill="#FFFFFF" opacity="0.14"/>
    <path d="M294 204 L310 211 V221 C310 232 303 240 294 243 C285 240 278 232 278 221 V211 L294 204 Z" stroke="#FFFFFF" stroke-width="2.2" fill="none" opacity="0.75"/>
    <path d="M288 223 L292 227 L301 218" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>

  <!-- 3D Display Podium Blocks (Right of Bag, matching reference) -->
  <g filter="url(#softShadow)">
    <!-- Back/Higher Podium -->
    <polygon points="348,268 455,268 475,280 368,280" fill="#F8FAFC"/>
    <rect x="348" y="280" width="107" height="66" fill="#FFFFFF"/>
    <polygon points="455,268 475,280 475,346 455,346" fill="#E2E8F0"/>

    <!-- Front/Lower Podium -->
    <polygon points="392,306 510,306 526,316 408,316" fill="#F8FAFC"/>
    <rect x="392" y="316" width="118" height="44" fill="#FFFFFF"/>
    <polygon points="510,306 526,316 526,360 510,360" fill="#CBD5E1"/>
  </g>

  <!-- Navy Product Bottle on Higher Podium -->
  <g transform="translate(384, 156)">
    <!-- Cap -->
    <rect x="16" y="0" width="22" height="14" rx="3" fill="#0F253E"/>
    <rect x="20" y="14" width="14" height="8" fill="#1E3A5F"/>
    <!-- Bottle Body -->
    <rect x="4" y="22" width="46" height="92" rx="10" fill="#132B47"/>
    <!-- Label -->
    <rect x="12" y="42" width="30" height="46" rx="3" fill="#CBD5E1"/>
    <rect x="17" y="52" width="20" height="3" rx="1.5" fill="#64748B"/>
    <rect x="17" y="60" width="14" height="3" rx="1.5" fill="#94A3B8"/>
  </g>

  <!-- White/Blue Product Jar on Lower Podium -->
  <g transform="translate(446, 224)">
    <rect x="4" y="0" width="44" height="12" rx="4" fill="#60A5FA"/>
    <rect x="0" y="12" width="52" height="44" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="10" y="24" width="32" height="18" rx="3" fill="#FFFFFF"/>
  </g>

  <!-- Floating Emerald Security Shield (Top Right, matching reference) -->
  <g filter="url(#cardShadow)" transform="translate(482, 28)">
    <path d="M38 6 L70 18 V44 C70 67 56 84 38 92 C20 84 6 67 6 44 V18 L38 6 Z" fill="#FFFFFF"/>
    <path d="M38 12 L64 22 V44 C64 63 52 77 38 84 C24 77 12 63 12 44 V22 L38 12 Z" fill="url(#shieldGrad)"/>
    <path d="M27 47 L35 55 L50 38" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Encrypted Transaction Card + Green Padlock (Bottom Right, matching reference) -->
  <g filter="url(#cardShadow)" transform="translate(415, 295)">
    <rect x="0" y="0" width="156" height="92" rx="12" fill="url(#navyCardGrad)"/>
    <!-- EMV Chip -->
    <rect x="16" y="18" width="24" height="18" rx="4" fill="#E2E8F0"/>
    <line x1="16" y1="27" x2="40" y2="27" stroke="#94A3B8" stroke-width="1.2"/>
    <line x1="28" y1="18" x2="28" y2="36" stroke="#94A3B8" stroke-width="1.2"/>
    <!-- TLS 1.3 / AES-256 Badge Text -->
    <rect x="92" y="18" width="48" height="14" rx="7" fill="#1E3A5F"/>
    <text x="116" y="28" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">AES-256</text>
    <!-- Masked Ciphertext Dots -->
    <text x="16" y="55" fill="#CBD5E1" font-family="monospace" font-size="10.5" letter-spacing="1.5">•••• •••• •••• 3072</text>
    <!-- Bottom Card Bars -->
    <rect x="16" y="68" width="52" height="5" rx="2.5" fill="#475569"/>
    <circle cx="114" cy="70" r="8" fill="#CBD5E1" opacity="0.85"/>
    <circle cx="124" cy="70" r="8" fill="#60A5FA" opacity="0.85"/>

    <!-- Overlapping Emerald Green Lock Circle -->
    <circle cx="150" cy="80" r="24" fill="#28B885"/>
    <rect x="141" y="79" width="18" height="14" rx="3" fill="#FFFFFF"/>
    <path d="M145 79 V74 C145 70.5 155 70.5 155 74 V79" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
    <circle cx="150" cy="85" r="2" fill="#28B885"/>
  </g>

  <!-- Floating Mini Order Verified Pill (Top Left Accent) -->
  <g filter="url(#softShadow)" transform="translate(36, 66)">
    <rect x="0" y="0" width="168" height="48" rx="12" fill="#FFFFFF" stroke="#E6ECF2" stroke-width="1"/>
    <circle cx="24" cy="24" r="14" fill="#EBF8F3"/>
    <path d="M19 24 L22.5 27.5 L29.5 20.5" stroke="#28B885" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="46" y="21" fill="#102A43" font-family="system-ui, sans-serif" font-size="11" font-weight="700">TLS 1.3 Verified</text>
    <text x="46" y="34" fill="#627D98" font-family="system-ui, sans-serif" font-size="9.5">RSA-PSS &amp; OAEP Active</text>
  </g>
</svg>
