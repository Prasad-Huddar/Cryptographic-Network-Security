{% extends "base.html" %}
{% block title %}Server Error{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="container">
        <div class="surface-card text-center p-5 mx-auto" style="max-width: 520px;">
            <div class="auth-shield-badge mx-auto mb-3" style="background-color: var(--danger-50); color: var(--danger-600); border-color: #fecaca;">
                <i class="bi bi-exclamation-triangle"></i>
            </div>
            <h1 class="h2 fw-bold text-navy mb-2">500 — Server Error</h1>
            <p class="text-muted small mb-4">An unexpected error occurred while processing your request. Please try again.</p>
            <a href="{{ url_for('products.index') }}" class="btn btn-emerald px-4">
                <i class="bi bi-house-door me-2"></i>Return to Storefront
            </a>
        </div>
    </div>
</div>
{% endblock %}
