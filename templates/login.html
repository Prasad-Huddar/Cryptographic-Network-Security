{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="auth-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="auth-shield-badge mb-3">
                            <i class="bi bi-shield-lock-fill"></i>
                        </div>
                        <h1 class="h3 fw-bold text-navy mb-1">Welcome Back</h1>
                        <p class="text-muted small mb-0">Sign in to your encrypted SecureShop account</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email"
                                       value="{{ email|default('') }}" required placeholder="name@example.com" autocomplete="email">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password"
                                       required placeholder="Enter your password" autocomplete="current-password">
                                <button type="button" class="btn btn-outline-navy px-3" data-toggle-password="password" aria-label="Show password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="remember" name="remember">
                                <label class="form-check-label small text-muted" for="remember">Keep me signed in</label>
                            </div>
                            <span class="badge badge-soft-emerald" style="font-size: 0.7rem;">
                                <i class="bi bi-lock-fill me-1"></i>PBKDF2-SHA256
                            </span>
                        </div>

                        <button type="submit" class="btn btn-emerald w-100 py-2 mb-3">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In Securely
                        </button>
                    </form>

                    <div class="pt-3 border-top text-center">
                        <p class="text-muted small mb-0">
                            Don't have an account yet?
                            <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold text-decoration-none">Create Account</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
