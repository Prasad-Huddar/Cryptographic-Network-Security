{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="container">
        <div class="surface-card text-center p-5 mx-auto" style="max-width: 520px;">
            <div class="auth-shield-badge mx-auto mb-3" style="background-color: var(--blue-50); color: var(--blue-600); border-color: var(--blue-100);">
                <i class="bi bi-compass"></i>
            </div>
            <h1 class="h2 fw-bold text-navy mb-2">404 — Page Not Found</h1>
            <p class="text-muted small mb-4">The page or product you requested could not be found.</p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{{ url_for('products.index') }}" class="btn btn-emerald px-4">
                    <i class="bi bi-house-door me-2"></i>Back to Home
                </a>
                <a href="{{ url_for('products.product_list') }}" class="btn btn-outline-navy px-4">
                    Browse Products
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
